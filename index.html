<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--ink:#2B2226;--muted:#8A8286;--line:#F0ECEE;--card:#FFFFFF;--soft:#F6F4F5;--tile:#FAF8F9;
  --glass:rgba(255,255,255,.80);--glass-b:rgba(43,34,38,.06);--glass-sh:0 8px 28px rgba(43,34,38,.06);
  --fresh:#5DBB78;--due:#E9A25A;--late:#E0607A;--ok-t:#3C8A55;--due-t:#B06A24;--late-t:#C23E5C;
  --accent:#FFB7C5;--accent-strong:#C24B68;--tint:#FFF0F3;--accent-2:#D5F3D8;--accent-2-deep:#9ADBA9;--tint-2:#F0FAF1;--accent-ink:#4A2330;--accent-2-ink:#1F4D2B;--blush:#F2C7C7;
  --blob1:#FFB7C5;--blob2:#D5F3D8;--blob3:#F2C7C7;--blobo:0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113;--ink:#F3F0F1;--muted:#9B9498;--line:rgba(255,255,255,.07);--card:#1A1A1D;--soft:#242428;--tile:#1F1F23;
  --glass:rgba(26,26,29,.80);--glass-b:rgba(255,255,255,.06);--glass-sh:0 8px 28px rgba(0,0,0,.40);
  --fresh:#8FD9A0;--due:#F2B77A;--late:#F28DA1;--ok-t:#9EE0AE;--due-t:#F2B77A;--late-t:#F5A3B3;
  --accent:#FFB7C5;--accent-strong:#FFB7C5;--tint:rgba(255,183,197,.12);--accent-2:#D5F3D8;--accent-2-deep:#7FCB93;--tint-2:rgba(213,243,216,.10);--accent-ink:#3A1A24;--accent-2-ink:#1F4D2B;--blush:#F2C7C7;
  --blob1:#FFB7C5;--blob2:#D5F3D8;--blob3:#F2C7C7;--blobo:0;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#111113;--ink:#F3F0F1;--muted:#9B9498;--line:rgba(255,255,255,.07);--card:#1A1A1D;--soft:#242428;--tile:#1F1F23;
  --glass:rgba(26,26,29,.80);--glass-b:rgba(255,255,255,.06);--glass-sh:0 8px 28px rgba(0,0,0,.40);
  --fresh:#8FD9A0;--due:#F2B77A;--late:#F28DA1;--ok-t:#9EE0AE;--due-t:#F2B77A;--late-t:#F5A3B3;
  --accent:#FFB7C5;--accent-strong:#FFB7C5;--tint:rgba(255,183,197,.12);--accent-2:#D5F3D8;--accent-2-deep:#7FCB93;--tint-2:rgba(213,243,216,.10);--accent-ink:#3A1A24;--accent-2-ink:#1F4D2B;--blush:#F2C7C7;
  --blob1:#FFB7C5;--blob2:#D5F3D8;--blob3:#F2C7C7;--blobo:0;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;min-height:100%}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--blobo);
  background:radial-gradient(45% 32% at 0% 0%,var(--blob1) 0,transparent 70%),radial-gradient(40% 30% at 100% 18%,var(--blob2) 0,transparent 70%),radial-gradient(50% 30% at 30% 62%,var(--blob1) 0,transparent 75%),radial-gradient(45% 30% at 100% 100%,var(--blob3) 0,transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .12s ease,background .2s,color .2s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.glass,.panel,.stat,.plan,.appbar,nav.tabs .in,#toast,#modal .sheet,.alert{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 140px}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;margin:0 -16px;padding:12px 16px 10px;border-width:0 0 1px;border-radius:0 0 22px 22px;box-shadow:0 6px 24px rgba(30,41,90,.06)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kicker{color:var(--muted);font-size:.82rem;font-weight:600}
h1{font-size:1.65rem;line-height:1.1;margin:1px 0 0;font-weight:800;letter-spacing:-.03em}
.hbtns{display:flex;gap:6px;align-items:center;flex-shrink:0}
.who{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.84rem;min-height:38px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:38px;height:38px;border-radius:999px;border:0;background:var(--soft);display:grid;place-items:center;padding:0;color:var(--ink)}
.icon svg{width:19px;height:19px}
.sync{font-size:.74rem;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent-2-deep)}
.sync b{font-weight:700}
h2{font-size:.82rem;font-weight:800;margin:28px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--muted);letter-spacing:.01em}
h2 small{font-size:.8rem;font-weight:600}
p{margin:.4em 0}
.muted{color:var(--muted)}
.meta{font-size:.82rem;color:var(--muted)}
.group{background:var(--card);border-radius:20px;padding:2px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.group>:last-child,.group>:last-child .chk{border-bottom:0!important}

/* planta */
.plan{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:88px 88px;grid-template-areas:"quartos quartos banheiro" "sala cozinha servico";gap:8px;padding:8px;border-radius:24px;margin:18px 0 10px}
.room{border:0;border-radius:16px;text-align:left;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;position:relative;color:var(--ink)}
.room{color:#3B2A30}.room .rn{font-weight:800;font-size:.92rem;line-height:1.1;letter-spacing:-.01em}
.room .rs{font-size:.74rem;font-weight:700}
.room[data-room="quartos"]::after{content:"";position:absolute;left:50%;top:12px;bottom:34px;border-left:2px dashed color-mix(in srgb,var(--ink) 16%,transparent)}
.room[data-room="quartos"] .rn{max-width:45%}
.bg-ok{background:color-mix(in srgb,var(--accent-2) 85%,var(--card))}.bg-ok .rs{color:#2E6B40}
.bg-due{background:color-mix(in srgb,var(--blush) 80%,var(--card))}.bg-due .rs{color:#8A4A2A}
.bg-late{background:color-mix(in srgb,var(--accent) 90%,var(--late))}.bg-late .rs{color:#9E2440}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--card);border-radius:999px;padding:8px 14px;font-size:.84rem;font-weight:600;min-height:38px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.d-ok{background:var(--fresh)}.d-due{background:var(--due)}.d-late{background:var(--late)}.d-nunca{background:color-mix(in srgb,var(--muted) 40%,transparent)}
.legend{display:flex;gap:14px;font-size:.76rem;color:var(--muted);margin:0 4px 4px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* checklist */
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.box{width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink) 22%,transparent);background:transparent;flex-shrink:0;display:grid;place-items:center;padding:0}
.chk.done .box{background:var(--accent-2);border-color:var(--accent-2-deep);color:var(--accent-2-ink)}
.chk.done .tt{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.box svg{width:16px;height:16px}
.tt{font-weight:600;line-height:1.3;font-size:.95rem}
.bar{height:6px;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:99px;overflow:hidden;margin:0 4px 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2-deep),var(--accent));border-radius:99px;transition:width .4s}

/* tarefas */
.task{border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;position:relative;padding-left:18px}
.task::before{content:"";position:absolute;left:0;top:23px;width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--muted) 40%,transparent)}
.task.st-ok::before{background:var(--fresh)}.task.st-due::before{background:var(--due)}.task.st-late::before{background:var(--late);box-shadow:0 0 0 4px color-mix(in srgb,var(--late) 18%,transparent)}
.tmain{background:none;border:0;text-align:left;padding:12px 0;display:flex;flex-direction:column;gap:3px;min-height:56px;justify-content:center}
.tmain:active{transform:none;opacity:.7}
.lbl{font-weight:700}
.lbl-ok{color:var(--fresh)}.lbl-due{color:color-mix(in srgb,var(--due) 80%,var(--ink))}.lbl-late{color:var(--late)}.lbl-nunca{color:var(--muted)}
.btn{border:0;background:var(--soft);border-radius:14px;padding:9px 16px;font-weight:700;min-height:42px;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.small{padding:7px 13px;min-height:36px;font-size:.82rem;border-radius:12px;background:color-mix(in srgb,var(--accent) 38%,transparent);color:var(--accent-strong)}
.link{background:none;border:0;padding:6px 0;color:var(--accent-strong);font-weight:700}
.tdet{grid-column:1/-1;padding:2px 0 14px;font-size:.9rem}
.tdet p{max-width:60ch}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input[type=number],input[type=date],input[type=text],select{background:var(--soft);border:1px solid transparent;border-radius:12px;padding:9px 11px;min-height:42px;outline:none}
input:focus,select:focus{border-color:var(--accent-strong);background:var(--card)}
input[type=number]{width:72px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);flex:1;min-width:0}
label.f input,label.f select{color:var(--ink);font-size:1rem;width:100%;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{border-radius:22px;padding:16px;margin:10px 0}
.alert{border-radius:20px;padding:13px 14px;margin:8px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.alert.late::before{background:var(--late)}.alert.due::before{background:var(--due)}
.alert.late{background:color-mix(in srgb,var(--late) 10%,var(--glass))}
.alert.due{background:color-mix(in srgb,var(--due) 12%,var(--glass))}
.empty{padding:16px 4px;color:var(--muted)}
.seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;font-size:.85rem;font-weight:700;min-height:36px;border-radius:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(15,23,42,.10)}
.meal{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.mbtns{display:flex;gap:6px;align-items:center;flex-shrink:0}
.x{border:0;background:none;width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:1.3rem;line-height:1}
.x:hover{background:var(--soft)}
.dayh{font-weight:800;font-size:.76rem;padding:12px 0 2px;color:var(--accent-strong);letter-spacing:.01em}

/* gatos */
.big{font-size:3.2rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin:4px 0;background:linear-gradient(120deg,var(--accent-strong),var(--fresh));-webkit-background-clip:text;background-clip:text;color:transparent}
.track{position:relative;height:12px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin:20px 0 28px}
.track .win{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--due) 60%,transparent);border-radius:4px}
.track .late{position:absolute;top:0;bottom:0;right:0;background:color-mix(in srgb,var(--late) 55%,transparent);border-radius:0 99px 99px 0}
.track .now{position:absolute;top:-5px;width:22px;height:22px;background:var(--card);border:4px solid var(--accent-strong);border-radius:50%;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.track .tk{position:absolute;top:18px;font-size:.72rem;font-weight:600;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:20px;padding:14px}
.stat .v{font-size:1.45rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:3px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.4rem;font-weight:700}
.stepper .v{font-size:2rem;font-weight:800;min-width:44px;text-align:center}

/* histórico */
.split{display:flex;height:40px;border-radius:14px;overflow:hidden;margin:8px 0;gap:3px}
.split div{display:flex;align-items:center;padding:0 12px;font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden}
.pa{background:var(--accent);color:var(--accent-ink)}
.pb{background:var(--accent-2);color:var(--accent-2-ink)}
.split .pa{border-radius:14px 4px 4px 14px}.split .pb{border-radius:4px 14px 14px 4px}
.cat{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;padding:6px 0;font-size:.84rem;font-weight:600}
.cbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--ink) 8%,transparent);gap:2px}
.heat{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.heat i{width:22px;height:22px;border-radius:7px;background:var(--soft);display:block}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tag{font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.tag.a{background:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-strong)}
.tag.b{background:var(--accent-2);color:var(--accent-2-ink)}

/* nav, toast, modal */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none}
nav.tabs .in{pointer-events:auto;display:flex;max-width:520px;width:100%;padding:6px;border-radius:28px;gap:2px}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:.66rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:22px;min-height:56px;justify-content:center}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);color:var(--ink);border-radius:18px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:calc(100% - 32px);font-size:.9rem;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--accent-strong);font-weight:800;padding:6px}
#modal{position:fixed;inset:0;background:rgba(5,10,25,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .sheet{width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));border-bottom:0;animation:up .28s cubic-bezier(.2,.8,.2,1)}
#modal .sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 20%,transparent);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#modal h3{font-size:1.4rem;margin:0 0 8px;letter-spacing:-.02em}
#modal h4{margin:18px 0 4px;font-size:1rem}
#modal p{max-width:62ch}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

/* gamificação */
.game{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;border-radius:26px;padding:16px;margin:16px 0 4px}
.ring{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(from -90deg,var(--accent-2-deep),var(--accent) calc(var(--p)*1%),color-mix(in srgb,var(--ink) 9%,transparent) 0)}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.ring>div{position:relative;text-align:center;line-height:1.05}
.ring b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.03em}
.ring span{font-size:.68rem;font-weight:700;color:var(--muted)}
.ring.full{box-shadow:0 0 0 4px color-mix(in srgb,var(--fresh) 30%,transparent),0 0 28px color-mix(in srgb,var(--fresh) 45%,transparent)}
.gstats{display:flex;gap:16px;margin-bottom:10px}
.gstats b{display:block;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.gstats span{font-size:.7rem;font-weight:700;color:var(--muted)}
.pl{margin-top:8px}
.plh{display:flex;align-items:center;gap:8px;font-size:.78rem}
.plh .meta{flex:1;font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plh b{font-size:.8rem;color:var(--fresh)}
.xpbar{height:7px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin-top:5px}
.xpbar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpbar.b i{background:var(--accent-2-deep)}
.pts{font-size:.72rem;font-weight:800;color:var(--accent-strong);background:color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:2px 7px;margin-left:6px;white-space:nowrap}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.duel .v{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.duel .vs{font-size:.8rem;font-weight:800;color:var(--muted)}
.lvcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvn{font-size:2.2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border-radius:20px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.badge .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--blush),var(--accent-2))}
.badge b{font-size:.76rem;line-height:1.15}
.badge span{font-size:.66rem;color:var(--muted);line-height:1.2}
.badge.lock{opacity:.5}.badge.lock .ic{filter:grayscale(1);background:var(--soft)}
.chk.pop .box{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.xpf{position:fixed;z-index:30;pointer-events:none;font-weight:800;font-size:1rem;color:var(--accent-strong);background:var(--card);border-radius:999px;padding:4px 10px;box-shadow:0 6px 18px rgba(0,0,0,.15);transform:translate(-50%,-50%);animation:rise 1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:29}
#banner{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px) scale(.95);opacity:0;z-index:31;border-radius:22px;padding:14px 20px;text-align:center;pointer-events:none;transition:.35s cubic-bezier(.2,.8,.2,1);min-width:240px;max-width:calc(100% - 32px);background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--glass-b);box-shadow:var(--glass-sh)}
#banner.on{opacity:1;transform:translate(-50%,0) scale(1)}
#banner .bi{font-size:2rem;line-height:1}
#banner b{display:block;font-size:1.1rem;margin-top:4px}
#banner span{font-size:.84rem;color:var(--muted);font-weight:600}
@media (max-width:360px){.game{grid-template-columns:96px 1fr}.ring{width:96px;height:96px}.badges{grid-template-columns:repeat(2,1fr)}}

/* leveza: sobreposições do tema claro/escuro */
.group{border:1px solid var(--line);box-shadow:none}
.room{color:var(--ink)!important;background:var(--tile)!important;box-shadow:inset 0 -4px 0 var(--st,transparent)}
.bg-ok{--st:var(--fresh)}.bg-due{--st:var(--due)}.bg-late{--st:var(--late)}
.bg-ok .rs{color:var(--ok-t)!important}.bg-due .rs{color:var(--due-t)!important}.bg-late .rs{color:var(--late-t)!important}
.plan{background:var(--card);border:1px solid var(--line);box-shadow:var(--glass-sh)}
.room[data-room="quartos"]::after{border-left-color:var(--line)}
nav.tabs button[aria-current="page"]{background:var(--tint);color:var(--accent-strong);box-shadow:none}
.who{background:var(--tint);color:var(--accent-strong)}
.btn.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{background:var(--tint)}
.chip{background:var(--soft);box-shadow:none}
.stepper button{background:var(--tint);color:var(--accent-strong)}
.tag.a{background:var(--tint)}.tag.b{background:var(--tint-2);color:var(--ok-t)}
.pts{background:var(--tint)}
.alert.late{background:var(--tint)}.alert.due{background:color-mix(in srgb,var(--due) 9%,var(--card))}
.panel,.stat{box-shadow:none}
.appbar{border-bottom:1px solid var(--line)}
.bgfx{display:none}

/* ===== v5: referência dribbble + duolingo + mercado pago ===== */
:root{--accent-shadow:color-mix(in srgb,var(--accent) 72%,#8A1F3C);--mint-shadow:color-mix(in srgb,var(--accent-2) 70%,#1F6B3A);--blush-shadow:color-mix(in srgb,var(--blush) 75%,#8A3A3A)}
.appbar{border-radius:0 0 26px 26px}
header.top{gap:12px}
.htxt{flex:1;min-width:0}
.htxt h1{font-size:1.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kicker{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:48px;height:48px;border-radius:50%;border:3px solid var(--card);background:linear-gradient(135deg,var(--accent),var(--blush));color:var(--accent-ink);font-weight:800;font-size:1.15rem;position:relative;flex-shrink:0;box-shadow:0 0 0 1px var(--line),0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent);padding:0}
.avatar .sw{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--accent-strong);font-size:.62rem;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.icon{background:var(--card);border:1px solid var(--line);width:44px;height:44px}
h2{font-size:1.12rem;color:var(--ink);font-weight:800;margin:26px 2px 12px;letter-spacing:-.015em}
h2 small{color:var(--muted);font-weight:600}
.chip{background:var(--card);border:1px solid var(--line);padding:9px 16px}
.chip[aria-pressed="true"]{background:var(--tint);color:var(--accent-strong);border-color:var(--accent)}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:14px 14px 22px;border-radius:34px;margin:16px 0 12px;background:linear-gradient(115deg,var(--accent) 0%,var(--blush) 100%);color:#4A2330;box-shadow:0 12px 28px color-mix(in srgb,var(--accent) 30%,transparent);overflow:hidden}
.hero::after{content:"";position:absolute;right:-36px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}
.hico{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#C24B68;box-shadow:0 4px 0 rgba(138,31,60,.18)}
.htx b{font-size:1.8rem;font-weight:800;display:block;line-height:1;letter-spacing:-.03em}
.htx span{font-size:.8rem;font-weight:700;opacity:.8}
.hpill{background:rgba(255,255,255,.8);border-radius:999px;padding:7px 11px;font-size:.8rem;font-weight:800;position:relative;z-index:1;white-space:nowrap}
.hbar{position:absolute;left:18px;right:18px;bottom:10px;height:5px;border-radius:9px;background:rgba(255,255,255,.45)}
.hbar i{display:block;height:100%;border-radius:9px;background:#fff;transition:width .5s}
/* pessoas */
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:11px 12px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;position:relative}
.person.me{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
.pav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--tint);color:var(--accent-strong)}
.pav.b{background:var(--tint-2);color:var(--ok-t)}
.pinfo{min-width:0;padding-right:26px}
.pinfo b{font-size:.88rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:.7rem;color:var(--muted);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo .xpbar{margin-top:6px;height:5px}
.ptoday{position:absolute;top:10px;right:11px;font-size:.72rem;font-weight:800;color:var(--ok-t)}
/* cômodos (carrossel) */
.rooms{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none;scroll-padding-left:16px}
.rooms::-webkit-scrollbar{display:none}
.rcard{flex:0 0 74%;max-width:290px;scroll-snap-align:start;border:1px solid var(--line);background:var(--card);border-radius:30px;padding:16px 16px 18px;min-height:176px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden;color:var(--ink)}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rname{font-size:1.35rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.ricon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--accent);color:#4A2330;box-shadow:0 4px 0 var(--accent-shadow)}
.rcard.st-ok .ricon{background:var(--accent-2);color:#1F4D2B;box-shadow:0 4px 0 var(--mint-shadow)}
.rcard.st-due .ricon{background:var(--blush);color:#4A2330;box-shadow:0 4px 0 var(--blush-shadow)}
.rbot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:22px}
.rbig{font-size:2.4rem;font-weight:800;letter-spacing:-.045em;line-height:1;display:block}
.rbig small{font-size:1.1rem;color:var(--muted);letter-spacing:0}
.rsub{font-size:.78rem;color:var(--muted);font-weight:600}
.rpill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:8px 11px;font-size:.75rem;font-weight:700;white-space:nowrap}
.rprog{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--soft)}
.rprog i{display:block;height:100%;background:var(--accent-2-deep);border-radius:0 9px 9px 0}
/* tiles de prioridade */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:168px}
.tbody{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px;color:var(--ink)}
.tbody:active{transform:none;opacity:.7}
.ttl{font-weight:800;font-size:.98rem;line-height:1.22;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tpill{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;border-radius:999px;padding:4px 10px;font-size:.7rem;font-weight:800;background:var(--soft);color:var(--muted)}
.tpill .dot{width:7px;height:7px}
.tpill.st-late{background:var(--tint);color:var(--late-t)}
.tpill.st-due{background:color-mix(in srgb,var(--due) 14%,var(--card));color:var(--due-t)}
.tpill.st-ok{background:var(--tint-2);color:var(--ok-t)}
.tfoot{display:flex;justify-content:space-between;align-items:center}
.tfoot .pts{margin-left:0}
.cbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#4A2330;display:grid;place-items:center;box-shadow:0 4px 0 var(--accent-shadow);padding:0}
.cbtn svg{width:22px;height:22px}
/* botões estilo Duolingo */
.btn.primary{border-radius:16px;font-weight:800;box-shadow:0 4px 0 var(--accent-shadow)}
.btn{border-radius:16px}
.btn.primary:active,.cbtn:active,.ricon:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-shadow)}
.big-btn{width:100%;min-height:54px;font-size:1.02rem;margin:16px 0 6px}
.how{background:var(--soft);border-radius:20px;padding:12px 14px;margin:14px 0 4px}
.how p{margin:4px 0 0;font-size:.92rem}
.box{border-width:2.5px}
.chk.done .box{box-shadow:0 3px 0 var(--mint-shadow)}
/* barra inferior: pílula flutuante (ref.) + rótulos (Mercado Pago) */
nav.tabs{left:10px;right:10px}
nav.tabs .in{align-items:center;padding:8px;border-radius:34px;gap:2px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(43,34,38,.12)}
nav.tabs button{flex:1 1 0;min-width:0;min-height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;color:var(--muted);font-size:.64rem;font-weight:700;padding:2px 0;transition:flex-grow .3s cubic-bezier(.2,.8,.2,1),background .2s}
nav.tabs button .ico{width:44px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.25s}
nav.tabs button .ico svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{flex-grow:2.2;flex-direction:row;gap:8px;justify-content:flex-start;padding:4px 12px 4px 4px;background:var(--tint);color:var(--accent-strong);font-size:.86rem;font-weight:800}
nav.tabs button[aria-current="page"] .ico{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#4A2330;box-shadow:0 3px 0 var(--accent-shadow);flex-shrink:0}
nav.tabs button[aria-current="page"] .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:370px){.rcard{flex-basis:82%}.tiles{gap:10px}.tile{padding:12px}nav.tabs button{font-size:.58rem}}

/* projeto escritório */
.hero.mint{background:linear-gradient(115deg,var(--accent-2) 0%,#F3FBF4 100%);color:#1F4D2B;box-shadow:0 12px 28px color-mix(in srgb,var(--accent-2-deep) 35%,transparent)}
.hero.mint .hico{color:#2E7D4A;box-shadow:0 4px 0 rgba(31,77,43,.15)}
.back{margin-top:10px;text-decoration:none;font-size:.9rem}
.gt{font-size:1.15rem;font-weight:800;display:block;line-height:1.25;letter-spacing:-.01em}
.btn[disabled]{opacity:.45;box-shadow:none!important;cursor:not-allowed;transform:none!important}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 6px}
.pnode-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x))}
.pnode{width:66px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;font-weight:800;font-size:1.25rem;background:var(--soft);color:var(--muted);box-shadow:0 6px 0 color-mix(in srgb,var(--soft) 75%,#000 14%);padding:0}
.pnode.done{background:var(--accent-2);color:#1F4D2B;box-shadow:0 6px 0 var(--mint-shadow)}
.pnode.cur{width:78px;height:78px;background:var(--accent);color:#4A2330;box-shadow:0 6px 0 var(--accent-shadow),0 0 0 8px var(--tint)}
.pnode svg{width:28px;height:28px}
.pnode:active{transform:translateY(4px)}
.plabel{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.25;max-width:150px}
.plabel b{color:var(--ink);font-size:.82rem}
.projc{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 14px;margin-top:12px;color:var(--ink)}
.projc b{display:block;font-size:.98rem;font-weight:800;line-height:1.22;margin:2px 0 7px}
.pbar{display:block;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent-2-deep);border-radius:9px}
.chev{font-size:1.7rem;color:var(--muted);line-height:1}
.ricon.pc{background:var(--accent-2);color:#1F4D2B;box-shadow:0 4px 0 var(--mint-shadow)}
.inv-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.inv-item .grow{flex:1;min-width:0}
.inv-item .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-item select{max-width:120px;font-size:.78rem;min-height:36px;padding:6px 8px}

/* marca */
.olock{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.osym{display:block;flex-shrink:0}
.owm{font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--ink)}
.kicker .olock .owm{font-size:15px}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;animation:spin-in .6s cubic-bezier(.2,.8,.2,1)}
.sp-tag{margin-top:10px;font-size:1rem;font-weight:600;color:var(--muted)}
@keyframes spin-in{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
.brandfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 14px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.brandfoot span:last-child{font-size:.85rem;font-weight:600;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){h1{font-size:1.45rem}.plan{grid-template-rows:78px 78px}}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div id="splash" aria-hidden="true"><div class="sp-in" id="spIn"></div></div>
<div class="wrap">
 <div class="appbar">
  <header class="top">
    <button class="avatar" data-act="who" id="whoBtn" aria-label="Trocar quem está usando"></button>
    <div class="htxt"><div class="kicker" id="hkick"></div><h1 id="htitle">Ocafy</h1></div>
    <div class="hbtns">
      <button class="icon" id="themeBtn" data-act="themeToggle" aria-label="Alternar modo claro e escuro"></button>
      <button class="icon" data-act="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>
  <div class="sync" id="sync"></div>
 </div>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in" id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite"><span id="tmsg"></span><button id="tundo" hidden>Desfazer</button></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="banner" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>

const queues={};
function q(key,fn){const p=(queues[key]||Promise.resolve()).then(fn,fn);queues[key]=p.catch(()=>{});return p}
function writeFail(e){console.warn(e);toast('Não foi possível salvar agora. Confira a conexão e tente de novo.')}
const Store={
 mergeCfg(p){cfgRaw=merge(cfgRaw,p);render();if(mode==='local'){saveLocal();return}

function cleanEntries(o){const r={};for(const k in (o||{}))if(o[k])r[k]=o[k];return r}
async function attachDb(db){
 const local={cfg:clone(cfgRaw),st:clone(st),days:clone(days)};
 const stash={};let gc=false,gs=false,gd=false;
 const ready=new Promise(res=>{const chk=()=>{if(gc&&gs&&gd)res(true)};
  db.doc('house/config').onSnapshot(s=>{exists.cfg=s.exists;const v=s.exists?clone(s.data()):{};if(mode==='db'){cfgRaw=v;softRender()}else stash.cfg=v;gc=true;chk()},e=>console.warn(e));
  db.doc('house/state').onSnapshot(s=>{exists.st=s.exists;const v=s.exists?clone(s.data()):{};if(mode==='db'){st=v;softRender()}else stash.st=v;gs=true;chk()},e=>console.warn(e));
  db.collection('days').orderBy('date','desc').limit(60).onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=clone(v)});if(mode==='db'){days=o;softRender()}else stash.days=o;gd=true;chk()},e=>console.warn(e));
 });
 const ok=await Promise.race([ready,new Promise(r=>setTimeout(()=>r(false),12000))]);
 if(!ok)return;
 DB=db;mode='db';
 const dbEmpty=!exists.cfg&&!exists.st&&!Object.keys(stash.days||{}).length;
 const localHas=Object.keys(local.st).length||Object.keys(local.days).length||Object.keys(local.cfg).length;
 if(dbEmpty&&localHas){
  cfgRaw=local.cfg;st=local.st;days=local.days;render();
  try{await db.doc('house/config').set(clone(cfgRaw));exists.cfg=true;await db.doc('house/state').set(clone(st));exists.st=true;
   for(const k of Object.keys(days))await db.doc('days/'+k).set({date:k,entries:cleanEntries(days[k].entries)})}catch(e){console.warn(e)}
 }else{cfgRaw=stash.cfg||{};st=stash.st||{};days=stash.days||{}}
 render();
}

function recomputeLast(task){const e=allEntries().find(x=>x.task===task);return e?{at:e.at,who:e.who}:null}

const fx={c:null,ctx:null,ps:[],run:false};
function fxInit(){fx.c=$('#fx');fx.ctx=fx.c.getContext('2d');const r=()=>{const d=devicePixelRatio||1;fx.c.width=innerWidth*d;fx.c.height=innerHeight*d;fx.ctx.setTransform(d,0,0,d,0,0)};r();addEventListener('resize',r)}
function confetti(x,y,n=40,power=1){if(RM)return;if(!fx.c)fxInit();const cs=getComputedStyle(document.documentElement);
 const cols=['--accent','--accent-2','--fresh','--due','--late'].map(v=>cs.getPropertyValue(v).trim());
 for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3,v=(4+Math.random()*7)*power;
  fx.ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3+Math.random()*4,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1})}
 if(!fx.run){fx.run=true;requestAnimationFrame(tick)}}
function tick(){const g=fx.ctx;g.clearRect(0,0,innerWidth,innerHeight);fx.ps=fx.ps.filter(p=>p.life>0&&p.y<innerHeight+20);
 fx.ps.forEach(p=>{p.vy+=.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.012;g.save();g.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});
 if(fx.ps.length)requestAnimationFrame(tick);else{fx.run=false;g.clearRect(0,0,innerWidth,innerHeight)}}

async function complete(id,atDate,note,rect){
 const t=TMAP[id];const at=atDate||new Date();const dk=dayKey(at);const eid=uid();
 const s=status(t);let bonus=0;
 if(!atDate){if(REC.includes(t)&&s.s!=='late'&&s.s!=='ok')bonus=Math.max(2,Math.round(t.mins*.5));
  if(t.r==='manha'&&at.getHours()<11)bonus=3;if(t.r==='noite'&&at.getHours()>=18)bonus=3}
 const pts=5+t.mins+bonus;const curXp=xpOf(me);
 const before={lv:levelOf(curXp).lv,bs:new Set(badges().filter(b=>b.ok).map(b=>b.id)),m:blockDone('manha'),n:blockDone('noite')};
 const entry={task:id,who:me,at:at.toISOString(),pts};if(note)entry.note=note;
 justDone=id;setTimeout(()=>{justDone=null},700);
 Store.addEntry(dk,eid,entry);
 const prev=lastOf(id);const patch={xp:{[me]:curXp+pts}};
 if(!prev||prev.at<=entry.at)patch.last={[id]:{at:entry.at,who:me}};
 if(id==='area_troca'&&typeof st.litterStock==='number')patch.litterStock=Math.max(0,st.litterStock-bagsPerChange());
 Store.mergeSt(patch);
 floatXP(rect,`+${pts} XP`);if(rect)confetti(rect.left+rect.width/2,rect.top,bonus?22:12,.8);
 try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
 toast(`${title(t)}${bonus?' · bônus no prazo':''}`,()=>removeEntryFull(dk,eid));
 const L=levelOf(curXp+pts);if(L.lv>before.lv)banner('⭐',`${nm(me)} subiu para o nível ${L.lv}`,L.name);
 if(!before.m&&blockDone('manha'))banner('☀️','Manhã completa!','Rotina da manhã fechada');
 if(!before.n&&blockDone('noite'))banner('🌙','Reset da noite completo!','A casa vai amanhecer pronta');
 badges().filter(b=>b.ok&&!before.bs.has(b.id)).forEach(b=>banner(b.ic,`Conquista: ${b.n}`,b.d));
}
function removeEntryFull(dk,eid){
 const e=((days[dk]||{}).entries||{})[eid];if(!e)return;
 Store.removeEntry(dk,eid);
 const cur=lastOf(e.task);const patch={xp:{[wOf(e)]:Math.max(0,xpOf(wOf(e))-ptsOf(e))}};

}

 hist(){const now=new Date();const from=dayKey(new Date(Date.now()-(histP-1)*864e5));
  const es=allEntries().filter(e=>e.dk>=from);
  const tot={a:{n:0,m:0},b:{n:0,m:0}};const byCat={};
  es.forEach(e=>{const t=TMAP[e.task];if(!t)return;const w=e.who==='b'?'b':'a';tot[w].n++;tot[w].m+=t.mins;byCat[t.cat]=byCat[t.cat]||{a:0,b:0};byCat[t.cat][w]+=t.mins});
  const allM=tot.a.m+tot.b.m;const pa=allM?Math.round(tot.a.m/allM*100):50;
  const heat=[];const miss={};ROUT.forEach(t=>miss[t.id]=0);
  for(let i=histP-1;i>=0;i--){const d=dayKey(new Date(Date.now()-i*864e5));const done=new Set(es.filter(e=>e.dk===d).map(e=>e.task));
   const n=ROUT.filter(t=>done.has(t.id)).length;ROUT.forEach(t=>{if(!done.has(t.id))miss[t.id]++});
   heat.push(`<i title="${d}: ${n} de ${ROUT.length}" style="background:color-mix(in srgb,var(--fresh) ${Math.round(n/ROUT.length*100)}%,var(--soft))"></i>`)}
  const worst=ROUT.map(t=>({t,m:miss[t.id]})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m).slice(0,3);
  const late=REC.filter(t=>!isOff(t)).map(t=>({t,s:status(t)})).filter(x=>x.s.s==='late').sort((a,b)=>(b.s.d-b.s.mx)-(a.s.d-a.s.mx));
  let lastD='';const log=es.slice(0,80).map(e=>{const t=TMAP[e.task];const hd=e.dk!==lastD?`<div class="dayh">${relDay(fromKey(e.dk))[0].toUpperCase()+relDay(fromKey(e.dk)).slice(1)}</div>`:'';lastD=e.dk;
   return hd+`<div class="logrow"><div><div>${esc(t?title(t):e.task)}${e.note?` — ${esc(e.note)}`:''}</div><div class="meta">${fmtTime(new Date(e.at))} · +${ptsOf(e)} XP</div></div><div class="mbtns"><span class="tag ${e.who==='b'?'b':'a'}">${esc(nm(e.who))}</span><button class="x" data-act="delEntry" data-id="${e.dk}|${e.eid}" aria-label="Apagar registro">×</button></div></div>`}).join('');
  const mk=mondayKey(),A=ptsSince('a',mk),B=ptsSince('b',mk),sk2=streaks(),bs=badges(),nb=bs.filter(b=>b.ok).length;
  const lead=A===B?'Empatados — bora desempatar':`${nm(A>B?'a':'b')} está na frente por ${Math.abs(A-B)} XP`;
  const placar=`<h2>Desafio da semana<small>desde segunda</small></h2><div class="panel"><div class="duel"><div><span class="tag a">${esc(nm('a'))}</span><div class="v" style="margin-top:8px">${A}</div></div><div class="vs">×</div><div><span class="tag b">${esc(nm('b'))}</span><div class="v" style="margin-top:8px">${B}</div></div></div>
   <div class="split" style="height:12px;margin-top:14px"><div class="pa" style="width:${A+B?A/(A+B)*100:50}%;padding:0"></div><div class="pb" style="width:${A+B?B/(A+B)*100:50}%;padding:0"></div></div><p class="meta" style="text-align:center">${esc(lead)}. Somando: ${A+B} XP juntos.</p></div>
   <div class="lvcards">${['a','b'].map(w=>{const L=levelOf(xpOf(w));return `<div class="stat"><span class="tag ${w}">${esc(nm(w))}</span><div class="lvn" style="margin-top:10px">Nv ${L.lv}</div><div class="k">${L.name} · ${xpOf(w)} XP</div><div class="xpbar ${w}"><i style="width:${Math.round(L.cur/L.span*100)}%"></i></div><div class="k">faltam ${L.span-L.cur} XP</div></div>`}).join('')}</div>
   <h2>Conquistas<small>${nb} de ${bs.length} · recorde 🔥 ${sk2.best} dias</small></h2>
   <div class="badges">${bs.map(b=>`<div class="badge stat ${b.ok?'':'lock'}"><div class="ic">${b.ic}</div><b>${esc(b.n)}</b><span>${b.ok?esc(b.d):esc(b.d)+' · '+b.prog}</span></div>`).join('')}</div>`;
  return placar+`<h2>Relatório</h2><div class="seg"><button data-act="hp" data-id="7" aria-pressed="${histP===7}">7 dias</button><button data-act="hp" data-id="30" aria-pressed="${histP===30}">30 dias</button></div>
   <h2>Divisão do trabalho<small>${es.length} registros</small></h2>
   ${allM?`<div class="split"><div class="pa" style="width:${pa}%">${esc(nm('a'))} ${pa}%</div><div class="pb" style="width:${100-pa}%">${esc(nm('b'))} ${100-pa}%</div></div>
   <p class="meta">${esc(nm('a'))}: ${tot.a.n} tarefas, ~${Math.round(tot.a.m/60*10)/10} h · ${esc(nm('b'))}: ${tot.b.n} tarefas, ~${Math.round(tot.b.m/60*10)/10} h. Medido em minutos estimados, não em número de tarefas.</p>
   <div class="panel">${Object.keys(byCat).map(c=>{const v=byCat[c],s=v.a+v.b;return `<div class="cat"><span>${CATS[c]}</span><div class="cbar"><i class="pa" style="width:${v.a/s*100}%"></i><i class="pb" style="width:${v.b/s*100}%"></i></div></div>`}).join('')}</div>`:'<p class="empty">Ainda não há registros neste período.</p>'}
   <h2>Constância das rotinas diárias</h2><div class="panel"><div class="heat">${heat.join('')}</div><p class="meta">Cada quadrado é um dia; mais verde = mais itens da manhã e da noite feitos.</p></div>
   ${worst.length?`<h2>Onde a rotina está falhando</h2>${grp(worst.map(x=>`<div class="logrow"><span>${esc(title(x.t))}</span><span class="lbl lbl-late">faltou em ${x.m} de ${histP} dias</span></div>`).join(''))}`:''}
   ${late.length?`<h2>Atrasadas agora<small>${late.length}</small></h2>${grp(late.map(x=>`<div class="logrow"><div><div>${esc(title(x.t))}</div><div class="meta">Última vez: ${esc(nm(x.s.l.who))}, há ${x.s.d} dias</div></div><span class="lbl lbl-late">+${x.s.d-x.s.mx}d</span></div>`).join(''))}`:''}
   <div class="panel" style="margin-top:18px"><b>Revisão de domingo (15 min, juntos)</b><p class="meta">Olhem esta tela sem procurar culpado: o que atrasou foi falta de tempo, de dia definido ou de dono? Ajustem a divisão ou a frequência — o método se adapta à casa, não o contrário.</p></div>
   <h2>Registros</h2>${grp(log)||'<p class="empty">Nada registrado ainda.</p>'}`;
 }

function metodo(){openModal(`<div class="shead"><h3>Como o método funciona</h3><button class="x" data-act="close" aria-label="Fechar">×</button></div>
 <h4>Janela, não data fixa</h4><p>Cada tarefa tem um mínimo e um máximo de dias. Antes do mínimo, está em dia. Dentro da janela, pode fazer. Depois do máximo, atrasou. Isso evita a culpa do “era para ser terça” e mostra o que realmente importa hoje.</p>
 <h4>Âncoras de manhã e de noite</h4><p>Hábitos pegam quando são presos a algo que você já faz. A regra é do tipo “depois do café, eu recolho a areia” e “depois do jantar, eu faço o reset”. Pesquisas sobre intenções de implementação mostram que esse formato “quando X, faço Y” aumenta bastante a chance de cumprir.</p>
 <h4>Reset de 10 minutos</h4><p>A bagunça é acúmulo de pequenas decisões adiadas. Dez minutos por noite devolvendo as coisas ao lugar impedem que ela chegue ao ponto de exigir um sábado inteiro.</p>
 <h4>Ordem que economiza trabalho</h4><p>De cima para baixo (teto → móveis → chão), seco antes do molhado (aspirar → pano), e dar tempo ao produto: limpeza depende de ação mecânica, química, temperatura e tempo de contato. Pular o tempo de contato é o erro mais comum.</p>
 <h4>Registro e divisão justa</h4><p>Cada “Feito” guarda quem fez e quando. O Histórico compara pelo tempo estimado de cada tarefa, não pela quantidade — trocar a esponja não vale o mesmo que faxinar o banheiro.</p>
 <h4>Pontos, níveis e sequência</h4><p>Cada tarefa vale 5 XP mais os minutos que ela leva. Fazer dentro da janela dá bônus; a rotina da manhã antes das 11h e o reset depois das 18h também. A sequência 🔥 conta os dias seguidos em que vocês fizeram pelo menos 70% das rotinas diárias. O desafio da semana é amistoso: o placar que importa é o total dos dois.</p>
 <h4>Revisão semanal</h4><p>Domingo, 15 minutos juntos no Histórico. Sem acusação: o objetivo é ajustar frequências e responsabilidades até a rotina caber na vida de vocês.</p>`)}

document.addEventListener('input',e=>{const iv=e.target.closest('[data-idraft]');if(iv){invDraft[iv.dataset.idraft]=iv.value;return}const el=e.target.closest('[data-draft]');if(el){draft[el.dataset.draft]=el.value;if(el.dataset.draft==='prot'){const p=PMAP[el.value];const s=el.closest('.panel').querySelector('.frow .meta');if(s)s.textContent=p&&p.h?`Alerta para retirar ${p.h} h antes`:'Sem alerta de descongelamento'}}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const k=el.dataset.chg,id=el.dataset.id;
 if(k==='fmin'||k==='fmax'){const t=TMAP[id];let[mn,mx]=mm(t);const v=Math.max(1,Math.min(365,Math.round(+el.value||1)));if(k==='fmin'){mn=v;if(mx<mn)mx=mn}else{mx=v;if(mn>mx)mn=mx}Store.mergeCfg({over:{[id]:{min:mn,max:mx}}})}
 else if(k==='lit'){let v=+el.value;if(!(v>0))return;const p={[id]:v};const L=cfg().litter;if(id==='minDays'&&v>L.maxDays)p.maxDays=v;if(id==='maxDays'&&v<L.minDays)p.minDays=v;Store.mergeCfg({litter:p})}
 else if(k==='invdest'){Store.mergeSt({inventory:{[id]:{dest:el.value}}})}
 else if(k==='name'){const v=el.value.trim().slice(0,24);if(v)Store.mergeCfg({names:{[id]:v}})}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='invName'){e.preventDefault();A.invAdd()}});
setInterval(()=>{if(!$('#modal').classList.contains('on'))softRender()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)softRender()});

/* ---------- início ---------- */
loadLocal();render();
(function(){const sp=$('#splash');$('#spIn').innerHTML=`${OCAFY_SYM(92,isDark())}<div class="owm" style="font-size:46px;margin-top:14px">ocafy</div><div class="sp-tag">Deixa a casa ok.</div>`;setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)},RM?200:1100)})();
(async()=>{try{if(window.claude&&typeof claude.use==='function'){const db=await claude.use('db');if(db)await attachDb(db)}}catch(e){console.warn(e)}})();
</script>
